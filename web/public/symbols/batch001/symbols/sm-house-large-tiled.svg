<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-house-large-tiled">
    <!-- larger stone house — wider than sm-house-tiled, three bays -->
    <rect class="sm-stone" x="6" y="14" width="52" height="36" rx="1.5"/>
    <!-- ridge and two cross-ridges dividing three roof bays -->
    <path class="sm-ridge" d="M32,14 L32,50"/>
    <path class="sm-ridge" d="M6,32 L58,32"/>
    <!--
      Fish-scale tiles on all four quadrants.
      Quadrant bounds: NW x6–32 y14–32, NE x32–58 y14–32,
                       SW x6–32 y32–50, SE x32–58 y32–50.
    -->
    <!-- NW + NE: rows y=18..30 -->
    <path class="sm-hatch" d="M6,19  A4,4 0 0 1 14,19  M14,19 A4,4 0 0 1 22,19  M22,19 A4,4 0 0 1 30,19
                              M32,19 A4,4 0 0 1 40,19  M40,19 A4,4 0 0 1 48,19  M48,19 A4,4 0 0 1 56,19"/>
    <path class="sm-hatch" d="M10,23 A4,4 0 0 1 18,23  M18,23 A4,4 0 0 1 26,23  M26,23 A4,4 0 0 1 34,23
                              M36,23 A4,4 0 0 1 44,23  M44,23 A4,4 0 0 1 52,23"/>
    <path class="sm-hatch" d="M6,27  A4,4 0 0 1 14,27  M14,27 A4,4 0 0 1 22,27  M22,27 A4,4 0 0 1 30,27
                              M32,27 A4,4 0 0 1 40,27  M40,27 A4,4 0 0 1 48,27  M48,27 A4,4 0 0 1 56,27"/>
    <path class="sm-hatch" d="M10,31 A4,4 0 0 1 18,31  M18,31 A4,4 0 0 1 26,31  M26,31 A4,4 0 0 1 34,31
                              M36,31 A4,4 0 0 1 44,31  M44,31 A4,4 0 0 1 52,31"/>
    <!-- SW + SE: rows y=35..47 -->
    <path class="sm-hatch" d="M6,35  A4,4 0 0 1 14,35  M14,35 A4,4 0 0 1 22,35  M22,35 A4,4 0 0 1 30,35
                              M32,35 A4,4 0 0 1 40,35  M40,35 A4,4 0 0 1 48,35  M48,35 A4,4 0 0 1 56,35"/>
    <path class="sm-hatch" d="M10,39 A4,4 0 0 1 18,39  M18,39 A4,4 0 0 1 26,39  M26,39 A4,4 0 0 1 34,39
                              M36,39 A4,4 0 0 1 44,39  M44,39 A4,4 0 0 1 52,39"/>
    <path class="sm-hatch" d="M6,43  A4,4 0 0 1 14,43  M14,43 A4,4 0 0 1 22,43  M22,43 A4,4 0 0 1 30,43
                              M32,43 A4,4 0 0 1 40,43  M40,43 A4,4 0 0 1 48,43  M48,43 A4,4 0 0 1 56,43"/>
    <path class="sm-hatch" d="M10,47 A4,4 0 0 1 18,47  M18,47 A4,4 0 0 1 26,47  M26,47 A4,4 0 0 1 34,47
                              M36,47 A4,4 0 0 1 44,47  M44,47 A4,4 0 0 1 52,47"/>
  </g>
</svg>
