<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  .sm-crop     { fill: var(--sm-crop, #b5c98a); stroke: var(--sm-ink, #46303c); }
  </style>
  <g id="sm-field-harvested">
    <!-- pale stubble: stone fill (lighter than crop, lighter than fallow) -->
    <rect class="sm-stone" x="7" y="7" width="50" height="50" rx="2"/>
    <!-- stubble: short upright tick marks in offset rows mimicking cut stalks -->
    <path class="sm-hatch" d="
      M13,13 L13,18  M19,13 L19,18  M25,13 L25,18  M31,13 L31,18  M37,13 L37,18  M43,13 L43,18  M49,13 L49,18
      M10,21 L10,26  M16,21 L16,26  M22,21 L22,26  M28,21 L28,26  M34,21 L34,26  M40,21 L40,26  M46,21 L46,26  M52,21 L52,26
      M13,29 L13,34  M19,29 L19,34  M25,29 L25,34  M31,29 L31,34  M37,29 L37,34  M43,29 L43,34  M49,29 L49,34
      M10,37 L10,42  M16,37 L16,42  M22,37 L22,42  M28,37 L28,42  M34,37 L34,42  M40,37 L40,42  M46,37 L46,42  M52,37 L52,42
      M13,45 L13,50  M19,45 L19,50  M25,45 L25,50  M31,45 L31,50  M37,45 L37,50  M43,45 L43,50  M49,45 L49,50
    "/>
  </g>
</svg>
