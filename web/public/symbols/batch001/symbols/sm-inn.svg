<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-inn">
    <!-- north range: main inn building -->
    <rect class="sm-stone" x="8"  y="8"  width="48" height="15" rx="1.5"/>
    <path class="sm-hatch" d="M11,11 L53,11 M11,15 L53,15 M11,19 L53,19"/>
    <!-- west range -->
    <rect class="sm-stone" x="8"  y="8"  width="13" height="44" rx="1.5"/>
    <path class="sm-hatch" d="M11,24 L18,24 M11,30 L18,30 M11,36 L18,36 M11,42 L18,42 M11,48 L18,48"/>
    <!-- east range -->
    <rect class="sm-stone" x="43" y="8"  width="13" height="44" rx="1.5"/>
    <path class="sm-hatch" d="M46,24 L53,24 M46,30 L53,30 M46,36 L53,36 M46,42 L53,42 M46,48 L53,48"/>
    <!-- inner courtyard void -->
    <rect class="sm-void"  x="21" y="23" width="22" height="29" rx="1"/>
    <!-- south gateway posts -->
    <rect class="sm-stone" x="21" y="50" width="5"  height="6" rx="1"/>
    <rect class="sm-stone" x="38" y="50" width="5"  height="6" rx="1"/>
    <!-- inn sign post: small timber post in courtyard -->
    <circle class="sm-timber" cx="32" cy="38" r="3"/>
    <circle class="sm-void"   cx="32" cy="38" r="1.2"/>
  </g>
</svg>
