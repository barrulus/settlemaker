<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-market">
    <!-- covered market hall: open-sided, roof supported on pillars -->
    <rect class="sm-timber" x="7" y="18" width="50" height="28" rx="1.5"/>
    <!-- roof hatch -->
    <path class="sm-hatch" d="M10,23 L54,23 M10,28 L54,28 M10,33 L54,33 M10,38 L54,38 M10,43 L54,43"/>
    <!-- central ridge -->
    <path class="sm-ridge" d="M7,32 L57,32"/>
    <!-- support posts along centreline -->
    <circle class="sm-void" cx="17" cy="32" r="2.5"/>
    <circle class="sm-void" cx="27" cy="32" r="2.5"/>
    <circle class="sm-void" cx="37" cy="32" r="2.5"/>
    <circle class="sm-void" cx="47" cy="32" r="2.5"/>
    <!-- open end openings (north + south) indicated by gap in stroke -->
    <path class="sm-ridge" d="M7,18 L57,18"/>
    <path class="sm-ridge" d="M7,46 L57,46"/>
    <!-- stall dividers on both sides of centre -->
    <path class="sm-hatch" d="M17,18 L17,26 M27,18 L27,26 M37,18 L37,26 M47,18 L47,26
                              M17,38 L17,46 M27,38 L27,46 M37,38 L37,46 M47,38 L47,46"/>
  </g>
</svg>
