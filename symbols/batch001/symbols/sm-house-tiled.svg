<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-house-tiled">
    <!-- same footprint as sm-house -->
    <rect class="sm-stone" x="12" y="16" width="40" height="32" rx="1.5"/>
    <!-- roof ridge -->
    <path class="sm-ridge" d="M32,16 L32,48"/>
    <!--
      Fish-scale clay tiles: each arc is M x,y A 4,4 0 0 1 x+8,y
      which draws the downward-curving bottom edge of one tile
      (clockwise arc = convex downward = the exposed lower hem).
      Rows alternate offset by 4 px so tiles interlock like real courses.
      Left slope (x 12–32), right slope (x 32–52).
    -->
    <!-- row y=21, even — left: starts 12,20; right: starts 32,20 -->
    <path class="sm-hatch" d="M12,21 A4,4 0 0 1 20,21  M20,21 A4,4 0 0 1 28,21
                              M32,21 A4,4 0 0 1 40,21  M40,21 A4,4 0 0 1 48,21"/>
    <!-- row y=25, odd — left: starts 16; right: starts 36 -->
    <path class="sm-hatch" d="M16,25 A4,4 0 0 1 24,25  M24,25 A4,4 0 0 1 32,25
                              M36,25 A4,4 0 0 1 44,25  M44,25 A4,4 0 0 1 52,25"/>
    <!-- row y=29, even -->
    <path class="sm-hatch" d="M12,29 A4,4 0 0 1 20,29  M20,29 A4,4 0 0 1 28,29
                              M32,29 A4,4 0 0 1 40,29  M40,29 A4,4 0 0 1 48,29"/>
    <!-- row y=33, odd -->
    <path class="sm-hatch" d="M16,33 A4,4 0 0 1 24,33  M24,33 A4,4 0 0 1 32,33
                              M36,33 A4,4 0 0 1 44,33  M44,33 A4,4 0 0 1 52,33"/>
    <!-- row y=37, even -->
    <path class="sm-hatch" d="M12,37 A4,4 0 0 1 20,37  M20,37 A4,4 0 0 1 28,37
                              M32,37 A4,4 0 0 1 40,37  M40,37 A4,4 0 0 1 48,37"/>
    <!-- row y=41, odd -->
    <path class="sm-hatch" d="M16,41 A4,4 0 0 1 24,41  M24,41 A4,4 0 0 1 32,41
                              M36,41 A4,4 0 0 1 44,41  M44,41 A4,4 0 0 1 52,41"/>
    <!-- row y=45, even -->
    <path class="sm-hatch" d="M12,45 A4,4 0 0 1 20,45  M20,45 A4,4 0 0 1 28,45
                              M32,45 A4,4 0 0 1 40,45  M40,45 A4,4 0 0 1 48,45"/>
  </g>
</svg>
