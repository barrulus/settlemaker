<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  .sm-crop     { fill: var(--sm-crop, #b5c98a); stroke: var(--sm-ink, #46303c); }
  </style>
  <g id="sm-park">
    <!-- grass ground -->
    <rect class="sm-crop" x="6" y="6" width="52" height="52" rx="3"/>
    <!-- two winding paths crossing near centre — curved so they read as
         informal gravel walks rather than roads or field furrows -->
    <path class="sm-ridge" d="M6,32 Q14,26 22,32 Q30,38 38,30 Q46,22 58,28"/>
    <path class="sm-ridge" d="M32,6 Q26,16 32,24 Q38,32 30,42 Q24,50 32,58"/>
    <!-- central pond where the paths meet -->
    <circle class="sm-stone" cx="32" cy="30" r="6"/>
    <circle class="sm-void"  cx="32" cy="30" r="3.5"/>
    <!-- trees: one in each quadrant, sizes varied for a natural feel -->
    <circle class="sm-canopy-a" cx="14" cy="14" r="7"/>
    <circle class="sm-canopy-b" cx="14" cy="14" r="3.5"/>
    <circle class="sm-canopy-a" cx="50" cy="13" r="6"/>
    <circle class="sm-canopy-b" cx="50" cy="13" r="3"/>
    <circle class="sm-canopy-a" cx="13" cy="50" r="6"/>
    <circle class="sm-canopy-b" cx="13" cy="50" r="3"/>
    <circle class="sm-canopy-a" cx="50" cy="50" r="7"/>
    <circle class="sm-canopy-b" cx="50" cy="50" r="3.5"/>
    <!-- extra tree mid-left for asymmetry -->
    <circle class="sm-canopy-a" cx="14" cy="32" r="4"/>
    <circle class="sm-canopy-b" cx="14" cy="32" r="2"/>
  </g>
</svg>
