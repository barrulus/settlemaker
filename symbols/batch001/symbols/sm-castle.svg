<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-castle">
    <!-- curtain wall -->
    <rect class="sm-stone" x="10" y="10" width="44" height="44" rx="1.5"/>
    <!-- inner bailey (open courtyard) -->
    <rect class="sm-void" x="20" y="20" width="24" height="24" rx="1"/>
    <!-- wall-walk hatch -->
    <path class="sm-hatch" d="M20,13 L44,13 M13,20 L13,44 M51,20 L51,44 M20,51 L27,51 M37,51 L44,51"/>
    <!-- circular corner towers -->
    <circle class="sm-stone" cx="10" cy="10" r="9"/>
    <circle class="sm-stone" cx="54" cy="10" r="9"/>
    <circle class="sm-stone" cx="10" cy="54" r="9"/>
    <circle class="sm-stone" cx="54" cy="54" r="9"/>
    <!-- keep: rectangular, north-east quadrant of courtyard -->
    <rect class="sm-stone" x="32" y="20" width="12" height="12" rx="1"/>
    <circle class="sm-void" cx="38" cy="26" r="3.5"/>
    <!-- gatehouse gap in south wall -->
    <rect class="sm-void" x="27" y="52" width="10" height="8" rx="0.5"/>
  </g>
</svg>
