<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-cathedral">
    <!-- square nave below the rotunda; corners poke out from behind the circle -->
    <rect class="sm-stone" x="14" y="7" width="36" height="36" rx="1.5"/>
    <!-- large rotunda / nave circle (covers most of square, leaving only corners) -->
    <circle class="sm-stone" cx="32" cy="25" r="21"/>
    <!-- crossing tower void -->
    <circle class="sm-void" cx="32" cy="25" r="8"/>
    <!-- altar stone at centre -->
    <circle class="sm-stone" cx="32" cy="25" r="2.5"/>
    <!-- south choir arm jutting below the rotunda -->
    <rect class="sm-stone" x="26" y="43" width="12" height="14" rx="1.5"/>
    <path class="sm-hatch" d="M29,46 L29,55 M32,46 L32,55 M35,46 L35,55"/>
    <!-- apse: semicircle at south end of choir -->
    <path class="sm-stone" d="M26,55 Q32,62 38,55 Z"/>
  </g>
</svg>
