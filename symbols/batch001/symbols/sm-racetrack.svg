<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-racetrack">
    <!--
      Roman circus / hippodrome: flat west end (carceres/starting gates),
      semicircular east end. Both outer and inner arcs share the same
      centre (44,32) so the curved track width is uniform at 6 px.
    -->
    <!-- outer boundary: flat west wall + two rails + east semicircle -->
    <path class="sm-stone" d="M8,16 L44,16 A16,16 0 0,1 44,48 L8,48 Z"/>
    <!-- inner void: racing lane cutout -->
    <path class="sm-void"  d="M14,22 L44,22 A10,10 0 0,1 44,42 L14,42 Z"/>
    <!-- spina: central barrier running most of the track length -->
    <rect class="sm-stone" x="16" y="28" width="26" height="8" rx="1"/>
    <!-- turning posts (metae): east end of spina -->
    <circle class="sm-stone" cx="44" cy="32" r="3.5"/>
    <circle class="sm-void"  cx="44" cy="32" r="1.5"/>
    <!-- starting gate stalls (carceres): vertical dividers at west flat end -->
    <path class="sm-hatch" d="M10,22 L10,42 M12,22 L12,42"/>
    <path class="sm-hatch" d="M8,26 L14,26 M8,30 L14,30 M8,34 L14,34 M8,38 L14,38"/>
  </g>
</svg>
