<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-hut-mud">
    <!--
      Organic, slightly asymmetric perimeter — mud/adobe walls are hand-built
      so the plan is never quite rectangular. Thick walls shown by inner void.
    -->
    <path class="sm-timber" d="M18,11 Q28,8 40,10 Q50,11 52,22 Q54,32 52,43
                               Q50,53 38,55 Q26,57 16,52 Q8,47 9,34
                               Q8,22 12,15 Q14,11 18,11 Z"/>
    <!--
      Dense irregular hatch on the wall band — short strokes going in two
      roughly opposite angles, suggesting pressed and cracked mud/daub.
    -->
    <path class="sm-hatch" d="M12,18 L18,12  M18,56 L12,50  M52,18 L46,12  M52,46 L46,52
                              M10,26 L16,20  M10,40 L16,46  M48,20 L54,26  M48,44 L54,38
                              M10,34 L16,28  M10,42 L16,48  M48,28 L54,34  M48,42 L54,36"/>
    <!-- interior void — the single open living space -->
    <ellipse class="sm-void" cx="32" cy="33" rx="14" ry="12"/>
    <!-- narrow doorway break in south wall -->
    <rect class="sm-void" x="27" y="51" width="10" height="7" rx="0.5"/>
  </g>
</svg>
