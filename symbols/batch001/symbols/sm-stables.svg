<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-stables">
    <!-- stable building -->
    <rect class="sm-timber" x="7" y="14" width="50" height="36" rx="1.5"/>
    <!-- central aisle running east-west -->
    <path class="sm-ridge" d="M7,32 L57,32"/>
    <!-- stall dividers: north side (wall to aisle) -->
    <path class="sm-hatch" d="M15,14 L15,32 M22,14 L22,32 M29,14 L29,32 M36,14 L36,32 M43,14 L43,32 M50,14 L50,32"/>
    <!-- stall dividers: south side (aisle to wall) -->
    <path class="sm-hatch" d="M15,32 L15,50 M22,32 L22,50 M29,32 L29,50 M36,32 L36,50 M43,32 L43,50 M50,32 L50,50"/>
    <!-- feed troughs: small void marks at back of each stall, north side -->
    <path class="sm-hatch" d="M8,16 L14,16 M15,16 L21,16 M22,16 L28,16 M29,16 L35,16 M36,16 L42,16 M43,16 L49,16 M50,16 L56,16"/>
    <!-- feed troughs: south side -->
    <path class="sm-hatch" d="M8,48 L14,48 M15,48 L21,48 M22,48 L28,48 M29,48 L35,48 M36,48 L42,48 M43,48 L49,48 M50,48 L56,48"/>
  </g>
</svg>
