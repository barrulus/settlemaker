<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-road-cobbled">
    <!-- road surface -->
    <rect class="sm-stone" x="0" y="18" width="64" height="28" rx="0"/>
    <!-- road edges -->
    <path class="sm-ridge" d="M0,18 L64,18 M0,46 L64,46"/>
    <!-- cobble rows (horizontal mortar joints) -->
    <path class="sm-hatch" d="M0,23 L64,23 M0,28 L64,28 M0,33 L64,33 M0,38 L64,38 M0,43 L64,43"/>
    <!-- cobble columns: alternating offset per row (running bond) -->
    <!-- row band 18-23 -->
    <path class="sm-hatch" d="M4,18 L4,23 M12,18 L12,23 M20,18 L20,23 M28,18 L28,23 M36,18 L36,23 M44,18 L44,23 M52,18 L52,23 M60,18 L60,23"/>
    <!-- row band 23-28 (offset +4) -->
    <path class="sm-hatch" d="M8,23 L8,28 M16,23 L16,28 M24,23 L24,28 M32,23 L32,28 M40,23 L40,28 M48,23 L48,28 M56,23 L56,28"/>
    <!-- row band 28-33 -->
    <path class="sm-hatch" d="M4,28 L4,33 M12,28 L12,33 M20,28 L20,33 M28,28 L28,33 M36,28 L36,33 M44,28 L44,33 M52,28 L52,33 M60,28 L60,33"/>
    <!-- row band 33-38 (offset) -->
    <path class="sm-hatch" d="M8,33 L8,38 M16,33 L16,38 M24,33 L24,38 M32,33 L32,38 M40,33 L40,38 M48,33 L48,38 M56,33 L56,38"/>
    <!-- row band 38-43 -->
    <path class="sm-hatch" d="M4,38 L4,43 M12,38 L12,43 M20,38 L20,43 M28,38 L28,43 M36,38 L36,43 M44,38 L44,43 M52,38 L52,43 M60,38 L60,43"/>
    <!-- row band 43-46 (offset) -->
    <path class="sm-hatch" d="M8,43 L8,46 M16,43 L16,46 M24,43 L24,46 M32,43 L32,46 M40,43 L40,46 M48,43 L48,46 M56,43 L56,46"/>
  </g>
</svg>
