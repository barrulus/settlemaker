<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-road-dirt">
    <!-- dirt track surface -->
    <rect class="sm-timber" x="0" y="18" width="64" height="28" rx="0"/>
    <!-- road edge lines (slightly irregular to feel organic) -->
    <path class="sm-ridge" d="M0,18 Q16,19 32,18 Q48,17 64,18"/>
    <path class="sm-ridge" d="M0,46 Q16,45 32,46 Q48,47 64,46"/>
    <!-- worn wheel ruts -->
    <path class="sm-ridge" d="M0,26 Q10,25 22,27 Q36,29 48,26 Q56,24 64,26"/>
    <path class="sm-ridge" d="M0,38 Q12,39 24,37 Q38,35 50,38 Q58,40 64,38"/>
    <!-- loose earth texture along edges -->
    <path class="sm-hatch" d="M2,20 L8,20 M14,20 L19,20 M36,20 L41,20 M50,20 L55,20
                              M4,22 L9,22 M18,22 L22,22 M42,22 L46,22 M53,22 L58,22
                              M2,44 L7,44 M13,44 L18,44 M38,44 L43,44 M52,44 L57,44
                              M5,42 L10,42 M20,42 L25,42 M44,42 L49,42 M55,42 L60,42"/>
  </g>
</svg>
