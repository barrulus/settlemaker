<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-hut-straw">
    <!-- small timber-walled hut -->
    <rect class="sm-timber" x="12" y="17" width="40" height="30" rx="1.5"/>
    <!--
      Diagonal 45° hatch simulates a thatched roof seen from above —
      the slanting lines suggest the angle and texture of laid straw.
      Two directions crossing each other give the herringbone feel.
    -->
    <path class="sm-hatch" d="M12,33 L29,17  M12,41 L37,17  M12,47 L45,17  M20,47 L52,17  M28,47 L52,25  M36,47 L52,33"/>
    <path class="sm-hatch" d="M35,17 L12,39  M43,17 L12,47  M52,19 L20,47  M52,27 L28,47  M52,35 L36,47  M52,43 L44,47"/>
    <!-- roof ridge running east-west at apex -->
    <path class="sm-ridge" d="M12,32 L52,32"/>
    <!-- low doorway void on south face -->
    <rect class="sm-void" x="26" y="44" width="12" height="5" rx="0.5"/>
  </g>
</svg>
