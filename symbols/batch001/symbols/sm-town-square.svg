<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-town-square">
    <!-- paved open square -->
    <rect class="sm-stone" x="7" y="7" width="50" height="50" rx="1.5"/>
    <!-- cobble grid hatch -->
    <path class="sm-hatch" d="M7,15 L57,15 M7,23 L57,23 M7,31 L57,31 M7,39 L57,39 M7,47 L57,47 M7,55 L57,55"/>
    <path class="sm-hatch" d="M15,7 L15,57 M23,7 L23,57 M31,7 L31,57 M39,7 L39,57 M47,7 L47,57 M55,7 L55,57"/>
    <!-- central fountain: outer ring + inner pool -->
    <circle class="sm-stone" cx="32" cy="32" r="8"/>
    <circle class="sm-void"  cx="32" cy="32" r="4.5"/>
    <circle class="sm-stone" cx="32" cy="32" r="1.5"/>
    <!-- corner bollards / posts -->
    <rect class="sm-void" x="9"  y="9"  width="4" height="4" rx="0.5"/>
    <rect class="sm-void" x="51" y="9"  width="4" height="4" rx="0.5"/>
    <rect class="sm-void" x="9"  y="51" width="4" height="4" rx="0.5"/>
    <rect class="sm-void" x="51" y="51" width="4" height="4" rx="0.5"/>
  </g>
</svg>
