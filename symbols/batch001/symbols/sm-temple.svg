<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-temple">
    <!-- outer stylobate platform -->
    <rect class="sm-stone" x="5" y="9" width="54" height="46" rx="1"/>
    <!-- inner cella -->
    <rect class="sm-stone" x="17" y="19" width="30" height="26" rx="0.5"/>
    <path class="sm-hatch" d="M20,23 L44,23 M20,27 L44,27 M20,31 L44,31 M20,35 L44,35 M20,39 L44,39 M20,43 L44,43"/>
    <!--
      Columns sit in the peristyle walkway between outer wall and cella.
      West peristyle midpoint x≈11, east x≈53, north y≈14, south y≈50.
    -->
    <!-- corner columns -->
    <circle class="sm-void" cx="11" cy="14" r="2.5"/>
    <circle class="sm-void" cx="53" cy="14" r="2.5"/>
    <circle class="sm-void" cx="11" cy="50" r="2.5"/>
    <circle class="sm-void" cx="53" cy="50" r="2.5"/>
    <!-- west colonnade -->
    <circle class="sm-void" cx="11" cy="23" r="2.5"/>
    <circle class="sm-void" cx="11" cy="32" r="2.5"/>
    <circle class="sm-void" cx="11" cy="41" r="2.5"/>
    <!-- east colonnade -->
    <circle class="sm-void" cx="53" cy="23" r="2.5"/>
    <circle class="sm-void" cx="53" cy="32" r="2.5"/>
    <circle class="sm-void" cx="53" cy="41" r="2.5"/>
    <!-- north colonnade (between corner columns) -->
    <circle class="sm-void" cx="21" cy="14" r="2.5"/>
    <circle class="sm-void" cx="32" cy="14" r="2.5"/>
    <circle class="sm-void" cx="43" cy="14" r="2.5"/>
    <!-- south colonnade -->
    <circle class="sm-void" cx="21" cy="50" r="2.5"/>
    <circle class="sm-void" cx="32" cy="50" r="2.5"/>
    <circle class="sm-void" cx="43" cy="50" r="2.5"/>
  </g>
</svg>
