<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-tree-conifer">
    <!-- 12-point star — outer radius 22, inner radius 12, centred 32,32 -->
    <path class="sm-canopy-a" d="M32,10 L35.1,20.4 L43,12.9 L40.5,23.5 L51.1,21 L43.6,28.9
      L54,32 L43.6,35.1 L51.1,43 L40.5,40.5 L43,51.1 L35.1,43.6
      L32,54 L28.9,43.6 L21,51.1 L23.5,40.5 L12.9,43 L20.4,35.1
      L10,32 L20.4,28.9 L12.9,21 L23.5,23.5 L21,12.9 L28.9,20.4 Z"/>
    <!-- inner highlight — outer radius 14, inner radius 7 -->
    <path class="sm-canopy-b" d="M32,18 L33.8,25.2 L39,19.9 L36.9,27.1 L44.1,25 L38.8,30.2
      L46,32 L38.8,33.8 L44.1,39 L36.9,36.9 L39,44.1 L33.8,38.8
      L32,46 L30.2,38.8 L25,44.1 L27.1,36.9 L19.9,39 L25.2,33.8
      L18,32 L25.2,30.2 L19.9,25 L27.1,27.1 L25,19.9 L30.2,25.2 Z"/>
    <circle class="sm-void" cx="32" cy="32" r="5"/>
  </g>
</svg>
