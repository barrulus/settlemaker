<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  .sm-crop     { fill: var(--sm-crop, #b5c98a); stroke: var(--sm-ink, #46303c); }
  </style>
  <g id="sm-orchard">
    <!-- grassy ground between trees -->
    <rect class="sm-crop" x="7" y="7" width="50" height="50" rx="2"/>
    <!-- 3×3 grid of fruit trees, centres at 17 / 32 / 47 -->
    <circle class="sm-canopy-a" cx="17" cy="17" r="7"/>
    <circle class="sm-canopy-b" cx="17" cy="17" r="3.5"/>
    <circle class="sm-canopy-a" cx="32" cy="17" r="7"/>
    <circle class="sm-canopy-b" cx="32" cy="17" r="3.5"/>
    <circle class="sm-canopy-a" cx="47" cy="17" r="7"/>
    <circle class="sm-canopy-b" cx="47" cy="17" r="3.5"/>
    <circle class="sm-canopy-a" cx="17" cy="32" r="7"/>
    <circle class="sm-canopy-b" cx="17" cy="32" r="3.5"/>
    <circle class="sm-canopy-a" cx="32" cy="32" r="7"/>
    <circle class="sm-canopy-b" cx="32" cy="32" r="3.5"/>
    <circle class="sm-canopy-a" cx="47" cy="32" r="7"/>
    <circle class="sm-canopy-b" cx="47" cy="32" r="3.5"/>
    <circle class="sm-canopy-a" cx="17" cy="47" r="7"/>
    <circle class="sm-canopy-b" cx="17" cy="47" r="3.5"/>
    <circle class="sm-canopy-a" cx="32" cy="47" r="7"/>
    <circle class="sm-canopy-b" cx="32" cy="47" r="3.5"/>
    <circle class="sm-canopy-a" cx="47" cy="47" r="7"/>
    <circle class="sm-canopy-b" cx="47" cy="47" r="3.5"/>
  </g>
</svg>
