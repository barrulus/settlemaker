<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-dump">
    <!-- irregular midden/heap boundary — deliberately lumpy, not geometric -->
    <path class="sm-timber" d="M18,6 Q28,4 38,7 Q50,5 56,14 Q62,22 58,33
                               Q61,44 54,52 Q44,60 32,58 Q20,61 13,53
                               Q5,45 7,33 Q3,22 10,14 Q13,7 18,6 Z"/>
    <!-- horizontal hatch: loose layered refuse -->
    <path class="sm-hatch" d="M9,18 L55,18 M8,25 L56,25 M8,32 L56,32 M9,39 L55,39 M10,46 L54,46 M13,52 L51,52"/>
    <!-- diagonal hatch overlaid: cross the horizontal to suggest chaotic waste -->
    <path class="sm-hatch" d="M18,7 L52,41 M10,12 L48,50 M24,6 L57,39 M10,20 L40,50 M10,30 L30,50 M32,7 L57,32"/>
    <!-- void depressions / pits scattered across heap -->
    <circle class="sm-void" cx="22" cy="22" r="3"/>
    <circle class="sm-void" cx="42" cy="18" r="2.5"/>
    <circle class="sm-void" cx="36" cy="38" r="3.5"/>
    <circle class="sm-void" cx="20" cy="44" r="2"/>
    <circle class="sm-void" cx="48" cy="44" r="2.5"/>
  </g>
</svg>
