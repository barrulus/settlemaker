<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" fill="none" stroke-width="var(--sm-sw, 2)" stroke-linejoin="round" stroke-linecap="round">
  <style>
  .sm-stone    { fill: var(--sm-stone,    #e8dcc0); stroke: var(--sm-ink, #46303c); }
  .sm-timber   { fill: var(--sm-timber,   #d9c39a); stroke: var(--sm-ink, #46303c); }
  .sm-void     { fill: var(--sm-void,     #6b5460); stroke: var(--sm-ink, #46303c); }
  .sm-mark     { fill: var(--sm-ink,      #46303c); stroke: none; }
  .sm-canopy-a { fill: var(--sm-canopy-1, #4f7f43); stroke: var(--sm-ink, #46303c); }
  .sm-canopy-b { fill: var(--sm-canopy-2, #74a552); stroke: none; }
  .sm-ridge    { fill: none; stroke: var(--sm-ink, #46303c); }
  .sm-hatch    { fill: none; stroke: var(--sm-ink, #46303c);
                 stroke-width: calc(var(--sm-sw, 2) * 0.5); opacity: .45; }
  </style>
  <g id="sm-mine">
    <!-- outermost disturbed ground / spoil terrace -->
    <rect class="sm-stone" x="5" y="5" width="54" height="54" rx="2"/>
    <!-- diagonal cross-hatch on spoil: loose broken rock, not orderly like a building -->
    <path class="sm-hatch" d="M5,13 L13,5 M5,21 L21,5 M5,29 L29,5 M5,37 L37,5 M5,45 L45,5
                              M5,53 L53,5 M13,59 L59,13 M21,59 L59,21 M29,59 L59,29
                              M37,59 L59,37 M45,59 L59,45 M53,59 L59,53"/>
    <!-- second terrace: first cut down into the earth -->
    <rect class="sm-stone" x="14" y="14" width="36" height="36" rx="1.5"/>
    <!-- third terrace -->
    <rect class="sm-stone" x="23" y="23" width="18" height="18" rx="1"/>
    <!-- shaft: central void -->
    <rect class="sm-void"  x="27" y="27" width="10" height="10" rx="0.5"/>
    <!-- headframe / winding gear: cross of ridgelines over the shaft,
         representing the mine infrastructure above ground -->
    <path class="sm-ridge" d="M32,5 L32,27 M5,32 L27,32"/>
  </g>
</svg>
