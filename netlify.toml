[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
  # The web app compiles ../src directly (no published package boundary), so
  # library-only commits (changes under src/ with nothing under web/) must
  # still trigger a build. Skip only when NEITHER web/ nor the library src/
  # changed since the last build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../src"

[build.environment]
  NODE_VERSION = "22"

# "/fmg" is the machine endpoint (the URL contract in docs/url-api.md);
# query parameters pass through 200 rewrites untouched. "/" serves the
# human builder page.
[[redirects]]
  from = "/fmg"
  to = "/fmg.html"
  status = 200

# "/symbols" is the symbol-library reference sheet. The sprite and per-symbol
# files it loads live under /symbols/batch001/* — real static files, which
# Netlify serves ahead of this rewrite, so they are unaffected.
[[redirects]]
  from = "/symbols"
  to = "/symbols.html"
  status = 200
